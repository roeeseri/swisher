[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swisher*"]
namespaces = false

[project]
name = "swisher-prototype"
version = "0.3.0"
description = "Swisher basketball shooting analysis prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av>=16,<19",
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.11,<4.12",
  "pydantic>=2.10,<3",
  "rfdetr>=1.9,<2",
  "streamlit>=1.41,<1.42",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "tmp"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.setuptools.package-data]
"swisher.studio" = ["index.html", "pair.html"]
