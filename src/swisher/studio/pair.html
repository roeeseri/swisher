<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>צימוד הטלפון · Swisher</title><body style="background:#0a0f18;color:#eef4ff;font:18px system-ui;padding:28px;line-height:1.7"><h1 style="color:#ff9757">Swisher · חיבור לצילום</h1><p>הזינו את קוד הצימוד שמופיע במחשב. שני המכשירים צריכים להיות באותה רשת.</p><label>קוד צימוד<input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code" style="display:block;width:100%;padding:16px;border-radius:12px;font:28px monospace;letter-spacing:6px;box-sizing:border-box;margin:20px 0"></label><button id="pair" style="padding:15px 25px;background:#ff9757;border:0;border-radius:12px;font:inherit">חיבור למחשב</button><p id="status" role="status"></p><script>document.getElementById('pair').onclick=async()=>{try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim()})});if(!r.ok)throw Error('קוד שגוי, פג תוקף או נסיונות רבים מדי. בדקו במחשב ונסו שוב.');location.href='/#capture'}catch(e){document.getElementById('status').textContent=e.message}}</script></body></html>
